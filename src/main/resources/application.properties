quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${SUPABASE_USER}
quarkus.datasource.password=${SUPABASE_PASS}
quarkus.datasource.jdbc.url=${SUPABASE_URL}
quarkus.datasource.jdbc.max-size=16

quarkus.smallrye-openapi.path=/swagger
quarkus.swagger-ui.path=/swagger-ui
quarkus.swagger-ui.always-include=true
quarkus.flyway.migrate-at-start=true


# Habilita o suporte a CORS
quarkus.http.cors.enabled=true

# Origens permitidas (adicione o seu localhost do Angular e, futuramente, o domínio de produção do seu frontend)
quarkus.http.cors.origins=https://oranco-front.vercel.app
# Métodos HTTP permitidos
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH

# Cabeçalhos permitidos
quarkus.http.cors.headers=authorization,content-type,x-requested-with

# Permite o envio de credenciais (cookies, headers de autenticação, etc.) se necessário
quarkus.http.cors.access-control-allow-credentials=true
